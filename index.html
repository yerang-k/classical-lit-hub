<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>고전문학 공부방</title>
<style>
  :root{
    --bg:#faf6ee; --paper:#fffdf8; --ink:#2b2419; --ink-dim:#7a6f5c;
    --line:#e7ddc8; --accent:#a8562f; --accent-soft:#f3e2d3;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;
    line-height:1.6}
  header{padding:56px 20px 36px;text-align:center;background:
    radial-gradient(ellipse at top,#fff 0%,var(--bg) 70%)}
  header h1{margin:0 0 10px;font-size:1.9rem;font-weight:900;letter-spacing:-.5px}
  header h1 span{color:var(--accent)}
  header p{margin:0;color:var(--ink-dim);font-size:.98rem}
  main{max-width:720px;margin:0 auto;padding:0 20px 60px}
  section{margin-top:40px}
  section > h2{font-size:1.05rem;font-weight:800;margin:0 0 16px;
    display:flex;align-items:center;gap:8px}
  section > h2::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--accent)}
  .grid{display:grid;gap:16px}
  .card{display:block;background:var(--paper);border:1px solid var(--line);
    border-radius:16px;padding:22px 22px 20px;text-decoration:none;color:inherit;
    box-shadow:0 2px 10px #2b241908;transition:transform .15s,box-shadow .15s}
  .card:active{transform:scale(.985)}
  .card-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
  .card-top .tag{font-size:.72rem;font-weight:800;color:var(--accent);
    background:var(--accent-soft);padding:3px 10px;border-radius:999px}
  .card h3{margin:0;font-size:1.08rem;font-weight:800}
  .card p{margin:6px 0 0;color:var(--ink-dim);font-size:.9rem}
  .card .go{margin-top:14px;font-size:.85rem;font-weight:700;color:var(--accent)}
  .placeholder{border:1.5px dashed var(--line);border-radius:16px;padding:26px 22px;
    text-align:center;color:var(--ink-dim);font-size:.9rem;background:transparent}
  .placeholder b{display:block;color:var(--ink);font-size:1rem;margin-bottom:4px}
  footer{text-align:center;padding:30px 20px 50px;color:var(--ink-dim);font-size:.8rem}
</style>
</head>
<body>

<header>
  <h1>수능 <span>고전문학</span> 공부방</h1>
  <p>고전어휘 · 시어 매핑을 연습하는 작은 앱 모음</p>
</header>

<main>
  <section>
    <h2>지금 바로 해보기</h2>
    <div class="grid" id="app-grid"></div>
  </section>

  <section>
    <h2>준비 중</h2>
    <div class="placeholder">
      <b>새로운 앱을 만들고 있어요</b>
      완성되면 이 자리에 추가할게요
    </div>
  </section>
</main>

<footer>고전문학 공부방 · 국어 수업 자료</footer>

<script>
const APPS = [
  {
    tag: '게임',
    title: '수능 고전어휘 타임어택',
    desc: '떨어지는 고전어의 뜻을 제한 시간 안에 골라내는 게임',
    url: 'https://yerang-k.github.io/classical-vocab-timeattack/'
  },
  {
    tag: '학습',
    title: '<보기> 키워드 매핑 훈련',
    desc: '<보기>의 키워드와 원문 시어를 클릭으로 연결하는 연습',
    url: 'https://script.google.com/macros/s/AKfycbzKbM1NlKXHZT2Tdu6XQ8cQpAUbzcKt4BSj-wgZgmh46-JbEVAtVCKjOh_ncUWsj6OkZA/exec'
  }
];

document.getElementById('app-grid').innerHTML = APPS.map(a => `
  <a class="card" href="${a.url}" target="_blank" rel="noopener">
    <div class="card-top">
      <h3>${a.title}</h3>
      <span class="tag">${a.tag}</span>
    </div>
    <p>${a.desc}</p>
    <div class="go">열어보기 →</div>
  </a>
`).join('');
</script>

</body>
</html>
