<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>고전문학 공부방</title>
<link rel="stylesheet" as="style" crossorigin
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  :root{
    --bg:#f6f7fb; --paper:#ffffff; --ink:#14161f; --ink-dim:#6b7080;
    --line:#e7e9f2; --accent:#3348d1; --accent-dark:#26379e; --accent-soft:#e8ecfc;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#0b0d14; --paper:#12141f; --ink:#eef0f8; --ink-dim:#8d92a8;
      --line:#232636; --accent:#6b82ff; --accent-dark:#8fa0ff; --accent-soft:#1b2140;
    }
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:'Pretendard','Malgun Gothic','Apple SD Gothic Neo',sans-serif;
    line-height:1.6;-webkit-font-smoothing:antialiased}
  .wrap{max-width:920px;margin:0 auto;padding-inline:24px}

  /* ---- nav ---- */
  nav.topbar{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 82%,transparent);
    backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  nav.topbar .wrap{display:flex;align-items:center;justify-content:space-between;height:60px}
  .brand{font-weight:800;font-size:1.02rem;color:var(--ink);letter-spacing:-.01em;
    text-decoration:none;white-space:nowrap}
  .navlinks{display:flex;gap:8px}
  .navlinks a,.navlinks button{font:inherit;font-size:.84rem;font-weight:700;color:var(--ink-dim);
    text-decoration:none;background:none;border:none;cursor:pointer;
    padding:7px 14px;border-radius:999px;transition:background .15s,color .15s}
  .navlinks a:hover,.navlinks button:hover{background:var(--accent-soft);color:var(--accent)}

  /* ---- about modal ---- */
  .modal-backdrop{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
    padding:24px;background:rgb(10 12 20 / .5);backdrop-filter:blur(4px);
    opacity:1;transition:opacity .18s}
  .modal-backdrop[hidden]{display:none}
  .modal-card{position:relative;width:100%;max-width:340px;background:var(--paper);border:1px solid var(--line);
    border-radius:20px;padding:32px 28px 28px;text-align:center;
    box-shadow:0 24px 48px -12px rgb(10 12 20 / .35);
    animation:modal-in .18s ease}
  @keyframes modal-in{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:none}}
  .modal-close{position:absolute;top:14px;right:14px;width:30px;height:30px;border-radius:999px;border:none;
    background:var(--accent-soft);color:var(--ink-dim);display:flex;align-items:center;justify-content:center;
    cursor:pointer}
  .modal-close svg{width:15px;height:15px}
  .modal-close:hover{color:var(--accent)}
  .modal-avatar{width:52px;height:52px;margin:0 auto 16px;border-radius:16px;background:var(--accent);
    color:#fff;font-weight:800;font-size:1.3rem;display:flex;align-items:center;justify-content:center}
  .modal-card h3{margin:0 0 8px;font-size:1.05rem;font-weight:800;letter-spacing:-.01em}
  .modal-card p{margin:0;color:var(--ink-dim);font-size:.9rem;line-height:1.6}
  @media (prefers-reduced-motion:reduce){
    .modal-card{animation:none}
  }

  /* ---- inline app modal(iframe) ---- */
  .app-modal-backdrop{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;
    padding:12px;background:rgb(10 12 20 / .6);backdrop-filter:blur(4px)}
  .app-modal-backdrop[hidden]{display:none}
  .app-modal{position:relative;width:100%;max-width:1280px;height:min(96vh,1200px);background:var(--paper);
    border-radius:20px;overflow:hidden;box-shadow:0 24px 60px -12px rgb(10 12 20 / .4);
    animation:modal-in .18s ease}
  .app-modal iframe{width:100%;height:100%;border:none;display:block}
  .app-modal-close{position:absolute;top:12px;right:12px;z-index:1;width:34px;height:34px;border-radius:999px;
    border:none;background:rgb(20 22 31 / .55);color:#fff;display:flex;align-items:center;justify-content:center;
    cursor:pointer;backdrop-filter:blur(6px)}
  .app-modal-close svg{width:16px;height:16px}
  .app-modal-close:hover{background:var(--accent)}
  @media (max-width:640px){
    .app-modal-backdrop{padding:0}
    .app-modal{max-width:none;width:100%;height:100%;border-radius:0}
  }
  @media (prefers-reduced-motion:reduce){
    .app-modal{animation:none}
  }

  /* ---- hero ---- */
  .hero{padding:72px 0 48px;text-align:center}
  .accent-bar{width:34px;height:5px;border-radius:999px;background:var(--accent);margin:0 auto 22px}
  h1{font-weight:800;font-size:clamp(1.1rem,5.6vw,2.5rem);line-height:1.32;margin:0 0 14px;
    letter-spacing:-.02em;white-space:nowrap}
  h1 em{font-style:normal;color:var(--accent)}
  .lede{margin:0 auto;max-width:34em;color:var(--ink-dim);font-size:1rem}

  /* ---- apps section ---- */
  main{padding-bottom:72px}
  .section-head{display:flex;align-items:baseline;justify-content:space-between;margin:0 0 18px}
  .section-head h2{font-size:1.1rem;font-weight:800;margin:0;letter-spacing:-.01em}
  .section-head span{font-size:.82rem;color:var(--ink-dim)}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}

  .card{position:relative;display:flex;flex-direction:column;background:var(--paper);
    border:1px solid var(--line);border-radius:18px;padding:24px;text-decoration:none;color:inherit;
    box-shadow:0 1px 2px rgb(20 22 31 / .04);transition:transform .18s,box-shadow .18s,border-color .18s}
  .card:hover{transform:translateY(-4px);box-shadow:0 20px 36px -12px rgb(20 22 31 / .16);border-color:var(--accent)}
  .card:active{transform:translateY(-1px) scale(.99)}
  .icon-badge{width:42px;height:42px;border-radius:12px;background:var(--accent);
    display:flex;align-items:center;justify-content:center;margin-bottom:16px;flex:0 0 auto}
  .icon-badge svg{width:21px;height:21px;stroke:#fff}
  .card .tag{position:absolute;top:22px;right:22px;font-size:.7rem;font-weight:700;color:var(--accent);
    background:var(--accent-soft);padding:4px 11px;border-radius:999px}
  .card h3{margin:0 0 6px;font-size:1.06rem;font-weight:800;letter-spacing:-.01em}
  .card p{margin:0;color:var(--ink-dim);font-size:.88rem;flex:1}
  .card .go{margin-top:18px;font-size:.84rem;font-weight:700;color:var(--accent);
    display:flex;align-items:center;gap:5px}
  .card .go svg{width:14px;height:14px;transition:transform .15s}
  .card:hover .go svg{transform:translateX(3px)}

  .placeholder{display:flex;flex-direction:column;align-items:center;justify-content:center;
    border:1.5px dashed var(--line);border-radius:18px;padding:24px;text-align:center;color:var(--ink-dim)}
  .placeholder .icon-badge{background:transparent;border:1.5px dashed var(--line)}
  .placeholder .icon-badge svg{stroke:var(--ink-dim)}
  .placeholder b{display:block;color:var(--ink);font-size:.98rem;font-weight:800;margin-bottom:4px}
  .placeholder p{margin:0;font-size:.86rem}

  footer{text-align:center;padding:32px 20px 48px;color:var(--ink-dim);font-size:.78rem;
    border-top:1px solid var(--line)}

  @media (prefers-reduced-motion:reduce){
    html{scroll-behavior:auto}
    .card,.card .go svg{transition:none}
  }
  @media (max-width:640px){
    .hero{padding:52px 0 40px}
    .navlinks a,.navlinks button{padding:6px 11px;font-size:.8rem}
  }
</style>
</head>
<body>

<nav class="topbar">
  <div class="wrap">
    <a class="brand" href="#top">고전문학 공부방</a>
    <div class="navlinks">
      <a href="#apps">앱 모음</a>
      <button type="button" id="btn-about">만든 이</button>
    </div>
  </div>
</nav>

<div id="top" class="hero">
  <div class="wrap">
    <div class="accent-bar" aria-hidden="true"></div>
    <h1>고전문학, <em>게임처럼</em> 공부하기</h1>
    <p class="lede">수능 고전문학에 자주 나오는 어휘와 시어를 반복 연습으로 익히는 학습 앱 모음이에요.</p>
  </div>
</div>

<div class="modal-backdrop" id="about-modal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="about-title">
    <button type="button" class="modal-close" id="about-close" aria-label="닫기">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <div class="modal-avatar">Y</div>
    <h3 id="about-title">KIMYERANG</h3>
    <p>국어 교사입니다. 수업에 쓰려고 이 앱들을 만들었어요.</p>
  </div>
</div>

<div class="app-modal-backdrop" id="app-modal" hidden>
  <div class="app-modal" role="dialog" aria-modal="true">
    <button type="button" class="app-modal-close" id="app-modal-close" aria-label="닫기">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <iframe id="app-modal-frame" src="about:blank" title="앱 미리보기"></iframe>
  </div>
</div>

<main class="wrap">
  <section id="apps">
    <div class="section-head">
      <h2>앱 모음</h2>
      <span id="app-count"></span>
    </div>
    <div class="grid" id="app-grid"></div>
  </section>
</main>

<footer>
  고전문학 공부방 &copy; 2026 KIMYERANG.<br>
  본 앱은 자유롭게 사용할 수 있으나, 저작자의 허락 없는<br>
  복제·배포·수정은 금지합니다.
</footer>

<script>
const ICONS = {
  stopwatch: '<svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><circle cx="12" cy="13" r="8"/><path d="M12 13l3-2"/><path d="M9 2h6"/><path d="M12 2v3"/></svg>',
  link: '<svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><circle cx="7" cy="17" r="3.2"/><circle cx="17" cy="7" r="3.2"/><path d="M9.3 14.7l5.4-5.4"/></svg>',
  book: '<svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="M4 5.5C4 4.7 4.7 4 5.5 4H12v16H5.5C4.7 20 4 19.3 4 18.5v-13Z"/><path d="M20 5.5c0-.8-.7-1.5-1.5-1.5H12v16h6.5c.8 0 1.5-.7 1.5-1.5v-13Z"/></svg>',
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>'
};
const ARROW = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';

const APPS = [
  {
    tag: '게임',
    icon: 'stopwatch',
    title: '수능 고전어휘 타임어택',
    desc: '떨어지는 고전어의 뜻을 제한 시간 안에 골라내는 게임이에요.',
    url: 'https://yerang-k.github.io/classical-vocab-timeattack/'
  },
  {
    tag: '학습',
    icon: 'link',
    title: '<보기> 키워드 매핑 훈련',
    desc: '<보기>의 키워드와 원문 시어를 클릭으로 연결하는 연습이에요.',
    url: 'https://script.google.com/macros/s/AKfycbzKbM1NlKXHZT2Tdu6XQ8cQpAUbzcKt4BSj-wgZgmh46-JbEVAtVCKjOh_ncUWsj6OkZA/exec'
  },
  {
    tag: '만화',
    icon: 'book',
    title: '고전문학 만화',
    desc: '고전문학 작품을 만화로 바로 넘겨보는 뷰어예요.',
    url: 'https://yerang-k.github.io/classical-lit-comics/',
    inline: true
  }
];

const aboutModal = document.getElementById('about-modal');
function openAbout(){ aboutModal.hidden = false; document.body.style.overflow = 'hidden'; }
function closeAbout(){ aboutModal.hidden = true; document.body.style.overflow = ''; }
document.getElementById('btn-about').addEventListener('click', openAbout);
document.getElementById('about-close').addEventListener('click', closeAbout);
aboutModal.addEventListener('click', e => { if (e.target === aboutModal) closeAbout(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !aboutModal.hidden) closeAbout(); });

document.getElementById('app-count').textContent = APPS.length + '개';

document.getElementById('app-grid').innerHTML = APPS.map((a, i) => `
  <a class="card" href="${a.url}" ${a.inline ? `data-app-index="${i}"` : `target="_blank" rel="noopener"`}>
    <span class="tag">${a.tag}</span>
    <div class="icon-badge">${ICONS[a.icon]}</div>
    <h3>${a.title}</h3>
    <p>${a.desc}</p>
    <div class="go">열어보기 ${ARROW}</div>
  </a>
`).join('') + `
  <div class="placeholder">
    <div class="icon-badge">${ICONS.plus}</div>
    <b>새 프로젝트 준비 중</b>
    <p>완성되면 이 자리에 추가할게요</p>
  </div>
`;

const appModal = document.getElementById('app-modal');
const appModalFrame = document.getElementById('app-modal-frame');
function openAppModal(url){
  appModalFrame.src = url;
  appModal.hidden = false;
  document.body.style.overflow = 'hidden';
}
function closeAppModal(){
  appModal.hidden = true;
  appModalFrame.src = 'about:blank';
  document.body.style.overflow = '';
}
document.getElementById('app-grid').addEventListener('click', e => {
  const card = e.target.closest('[data-app-index]');
  if (!card) return;
  e.preventDefault();
  openAppModal(APPS[Number(card.dataset.appIndex)].url);
});
document.getElementById('app-modal-close').addEventListener('click', closeAppModal);
appModal.addEventListener('click', e => { if (e.target === appModal) closeAppModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !appModal.hidden) closeAppModal(); });
</script>

</body>
</html>
